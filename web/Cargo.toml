[package]
name = "angry-birds-web"
version = "0.1.0"
edition = "2021"
description = "Rust-powered personal dashboard for the browser"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
gloo-storage = "0.3"
gloo-timers = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlTextAreaElement"] }
